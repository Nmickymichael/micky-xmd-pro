services:
  - type: web
    name: micky-xmd-pro-web
    runtime: node
    plan: starter
    region: frankfurt
    branch: main
    buildCommand: npm install
    startCommand: npm run start:web
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - fromGroup: micky-xmd-pro-shared
      - key: NODE_ENV
        value: production
      - key: AUTH_COOKIE_NAME
        value: micky_access
      - key: MPESA_ENV
        value: sandbox
  - type: worker
    name: micky-xmd-pro-worker
    runtime: node
    plan: starter
    region: frankfurt
    branch: main
    buildCommand: npm install
    startCommand: npm run start:bot
    autoDeploy: true
    envVars:
      - fromGroup: micky-xmd-pro-shared
      - key: NODE_ENV
        value: production
      - key: WORKER_POLL_MS
        value: "15000"
      - key: LOG_LEVEL
        value: info
      - key: AI_BASE_URL
        value: https://api.openai.com/v1
      - key: AI_MODEL
        value: gpt-4o-mini

envVarGroups:
  - name: micky-xmd-pro-shared
    envVars:
      - key: SUPABASE_URL
        value: https://dtibowvdocfqihrgpdvk.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SESSION_ENCRYPTION_KEY
        generateValue: true
